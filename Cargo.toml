[package]
name = "zeta"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = "0.6"
dioxus-logger = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
anyhow = "1.0"
tracing = "0.1"

# SurrealDB dependencies
surrealdb = { version = "2.0", optional = true }

# Web-specific dependencies
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["AudioContext", "MediaRecorder", "MediaStream", "Blob", "BlobPropertyBag", "Window", "Navigator", "MediaDevices", "MediaStreamConstraints", "MediaTrackConstraints"], optional = true }
js-sys = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", optional = true }
base64 = "0.22"

[features]
default = ["desktop"]
desktop = ["surrealdb"]
web = ["wasm-bindgen", "wasm-bindgen-futures", "web-sys", "js-sys", "gloo-timers"]

[[bin]]
name = "zeta"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
